  'eg-user':    '#e2e8f0',
};
const EDGE_MK = { 'eg-sources':'url(#mg)', 'eg-preload':'url(#mg)', 'eg-user':'url(#mw)' };

let step = 0;
const lit = new Set();

function go(dir) {
  if (dir > 0 && step >= STEPS.length - 1) return;
  if (dir < 0 && step <= 0) return;
  step += dir;
  if (dir < 0) { lit.clear(); for (let i = 1; i <= step; i++) SHOW_AT[i].forEach(id => lit.add(id)); }
  else SHOW_AT[step].forEach(id => lit.add(id));
  render();
}

function render() {
  // ── Nodes ──
  const anyCoord = lit.has('ng-coordinator') || lit.has('ng-instruction') || lit.has('ng-ondemand');

  const nodeOpacity = {
    'ng-sources':     lit.has('ng-sources')     ? '1' : '0.22',
    'ng-mongo':       lit.has('ng-mongo')        ? '1' : '0.22',
    'ng-coordinator': anyCoord                   ? '1' : '0.25',
    'ng-user':        lit.has('ng-user')         ? '1' : '0.22',
    'ng-instruction': lit.has('ng-instruction')  ? '1' : (anyCoord ? '0.30' : '0.22'),
    'ng-ondemand':    lit.has('ng-ondemand')     ? '1' : (anyCoord ? '0.22' : '0.22'),
    'ng-response':    lit.has('ng-response')     ? '1' : '0.22',
  };

  Object.entries(nodeOpacity).forEach(([id, op]) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.style.opacity = op;
    if (GLOW[id]) el.setAttribute('filter', lit.has(id) || (id === 'ng-coordinator' && anyCoord) ? GLOW[id] : '');
  });

  // coord border
  const border = document.getElementById('coord-border');
  if (border) border.setAttribute('stroke-opacity', anyCoord ? '1' : '0.22');

  // ── Edges ──
  ['eg-sources', 'eg-preload', 'eg-user'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const isLit = lit.has(id);
    const color = EDGE_COLOR[id] || 'rgba(255,255,255,0.35)';
    el.querySelectorAll('path').forEach(p => {
      p.setAttribute('stroke', isLit ? color : 'rgba(255,255,255,0.10)');
      p.setAttribute('stroke-width', isLit ? '2.2' : '1.5');
      p.setAttribute('stroke-dasharray', isLit ? 'none' : '7 5');
      p.setAttribute('marker-end', isLit ? EDGE_MK[id] : 'url(#md)');
    });
    el.querySelectorAll('circle').forEach(c => {
      c.setAttribute('fill',   isLit ? 'rgba(110,231,183,0.15)' : 'rgba(255,255,255,0.08)');
      c.setAttribute('stroke', isLit ? color : 'rgba(255,255,255,0.15)');
    });
    const txt = el.querySelector('text');
    if (txt) txt.setAttribute('fill', isLit ? 'rgba(255,255,255,0.80)' : 'rgba(255,255,255,0.48)');
  });

  document.getElementById('step-caption').textContent = STEPS[step].sub || '';
  document.getElementById('counter').textContent  = `${step} / ${STEPS.length - 1}`;
  document.getElementById('hint').style.opacity   = step === 0 ? '1' : '0';
}

document.addEventListener('click', () => go(1));
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowRight') { e.preventDefault(); go(1); }
  if (e.code === 'ArrowLeft') { e.preventDefault(); go(-1); }
});

render();
</script>
</body>
</html>
