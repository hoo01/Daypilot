<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DayPilot Architecture</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #0d0b1e;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    cursor: pointer; user-select: none;
  }
  #layout {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; padding: 20px;
  }
  #top-label {
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.28em; text-transform: uppercase;
    color: rgba(255,255,255,0.20);
  }
  #svg-wrap { width: min(96vw, 1300px); aspect-ratio: 1280 / 570; }
  #diagram { width: 100%; height: 100%; }
  #subtitle {
    height: 26px; text-align: center;
    font-size: 15px; font-weight: 500;
    color: rgba(255,255,255,0.82); letter-spacing: -0.01em;
  }
  #hint { font-size: 10.5px; color: rgba(255,255,255,0.16); letter-spacing: 0.14em; transition: opacity 300ms ease; }
  #footer { font-size: 10px; color: rgba(255,255,255,0.12); letter-spacing: 0.14em; text-transform: uppercase; }
  #counter { position: absolute; top: 16px; right: 24px; font-size: 11px; color: rgba(255,255,255,0.16); letter-spacing: 0.06em; }
</style>
</head>
<body>
<div id="counter"></div>
<div id="layout">
  <div id="top-label">DayPilot &nbsp;·&nbsp; Multi-Agent Architecture</div>
  <div id="svg-wrap"><svg id="diagram" viewBox="0 0 1280 570" fill="none" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div id="subtitle"></div>
  <div id="hint">Space / Click to advance &nbsp;→</div>
  <div id="footer">Google ADK &nbsp;·&nbsp; Gemini 2.5 Flash &nbsp;·&nbsp; MongoDB Atlas + MCP &nbsp;·&nbsp; Google Routes API</div>
</div>
<script>
// ── NODE DATA ───────────────────────────────────────────────────────────────
// x,y = top-left; w,h = dimensions; iw = icon area width; r = corner radius
const N = {
  goals: {
    x:50, y:78, w:196, h:56, iw:50, r:12,
    title:'Goal Progress', sub:'track_goals', sub2:null,
    color:'#6ee7b7', gf:'g',
    icon:`<rect x="3" y="12" width="4.5" height="9" rx="1.5"/><rect x="10" y="7" width="4.5" height="14" rx="1.5"/><rect x="17" y="4" width="4.5" height="17" rx="1.5"/>`,
  },
  rel: {
    x:50, y:252, w:196, h:56, iw:50, r:12,
    title:'Relationship', sub:'Calendar & Context', sub2:null,
    color:'#6ee7b7', gf:'g',
    icon:`<circle cx="9" cy="7" r="3.5" stroke-width="1.8"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6" stroke-width="1.8" stroke-linecap="round"/><circle cx="17" cy="5.5" r="2.5" stroke-width="1.6"/><path d="M14 18.5c0-2.5 1.5-3.5 4-3.5" stroke-width="1.6" stroke-linecap="round"/>`,
  },
  health: {
    x:50, y:426, w:196, h:56, iw:50, r:12,
    title:'Health State', sub:'analyze_health', sub2:null,
    color:'#6ee7b7', gf:'g',
    icon:`<polyline points="1,12 5,12 7,5 10,19 13,12 16,12 18,6 21,12 23,12" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>`,
  },
  coordinator: {
    x:516, y:244, w:252, h:78, iw:58, r:14,
    title:'Coordinator', sub:'Gemini 2.5 Flash · Google ADK', sub2:'before_agent_callback',
    color:'#6ee7b7', gf:'g',
    icon:`<circle cx="12" cy="12" r="3.5" stroke-width="2"/><line x1="12" y1="2" x2="12" y2="6.5" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="17.5" x2="12" y2="22" stroke-width="2" stroke-linecap="round"/><line x1="2" y1="12" x2="6.5" y2="12" stroke-width="2" stroke-linecap="round"/><line x1="17.5" y1="12" x2="22" y2="12" stroke-width="2" stroke-linecap="round"/><line x1="5.6" y1="5.6" x2="8.5" y2="8.5" stroke-width="1.7" stroke-linecap="round"/><line x1="15.5" y1="15.5" x2="18.4" y2="18.4" stroke-width="1.7" stroke-linecap="round"/><line x1="5.6" y1="18.4" x2="8.5" y2="15.5" stroke-width="1.7" stroke-linecap="round"/><line x1="15.5" y1="8.5" x2="18.4" y2="5.6" stroke-width="1.7" stroke-linecap="round"/>`,
  },
  geo: {
    x:542, y:464, w:196, h:56, iw:50, r:12,
    title:'Geo Agent', sub:'Google Routes API', sub2:null,
    color:'#a78bfa', gf:'p',
    icon:`<path d="M12 2C8.1 2 5 5.1 5 9c0 5.3 7 13 7 13s7-7.7 7-13c0-3.9-3.1-7-7-7z" stroke-width="1.8"/><circle cx="12" cy="9" r="2.5" stroke-width="1.6"/>`,
  },
  user: {
    x:1030, y:78, w:175, h:56, iw:50, r:12,
    title:'User', sub:'', sub2:null,
    color:'#e2e8f0', gf:'w',
    icon:`<circle cx="12" cy="8" r="4" stroke-width="1.9"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" stroke-width="1.9" stroke-linecap="round"/>`,
  },
  mongo: {
    x:1006, y:422, w:212, h:64, iw:52, r:12,
    title:'MongoDB Atlas', sub:'Knowledge Graph · MCP', sub2:null,
    color:'#fbbf24', gf:'y',
    icon:`<ellipse cx="12" cy="5.5" rx="7" ry="2.5" stroke-width="1.7"/><path d="M5 5.5v4.5c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V5.5" stroke-width="1.7"/><path d="M5 10v4.5c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V10" stroke-width="1.7"/><path d="M5 14.5V19c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-4.5" stroke-width="1.7"/>`,
  },
};

// ── EDGE DATA ───────────────────────────────────────────────────────────────
const E = [
  { id:'e-goals',  from:'goals',       fs:'right',  to:'coordinator', ts:'left',   color:'#6ee7b7', mk:'g' },
  { id:'e-rel',    from:'rel',         fs:'right',  to:'coordinator', ts:'left',   color:'#6ee7b7', mk:'g' },
  { id:'e-health', from:'health',      fs:'right',  to:'coordinator', ts:'left',   color:'#6ee7b7', mk:'g' },
  { id:'e-user',   from:'user',        fs:'left',   to:'coordinator', ts:'right',  color:'#e2e8f0', mk:'w' },
  { id:'e-geo',    from:'coordinator', fs:'bottom', to:'geo',         ts:'top',    color:'#a78bfa', mk:'p' },
  { id:'e-mongo',  from:'coordinator', fs:'right',  to:'mongo',       ts:'left',   color:'#fbbf24', mk:'y' },
];

const STEPS = [
  { nodes:[],                                      edges:[],                           sub:null },
  { nodes:['goals','rel','health'],                edges:['e-goals','e-rel','e-health'], sub:'Before every response, three context streams load in parallel…' },
  { nodes:['coordinator'],                         edges:[],                           sub:'A Reasoning Agent checks in every day without being asked.' },
  { nodes:['geo'],                                 edges:['e-geo'],                   sub:'A Geo Agent calculates when you need to leave.' },
  { nodes:['mongo'],                               edges:['e-mongo'],                 sub:'A Knowledge Graph in MongoDB remembers your life.' },
  { nodes:['user'],                                edges:['e-user'],                  sub:"Gemini doesn't just get a question. It gets your life." },
];

// ── HELPERS ─────────────────────────────────────────────────────────────────
function toRgba(c, a) {
  if (!c) return `rgba(255,255,255,${a})`;
  if (c.startsWith('#')) {
    const h = c.slice(1);
    const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
    return `rgba(${r},${g},${b},${a})`;
  }
  const m = c.match(/[\d.]+/g);
  if (m) return `rgba(${m[0]},${m[1]},${m[2]},${a})`;
  return c;
}

function pt(id, side) {
  const n = N[id];
  if (side==='right')  return [n.x+n.w,       n.y+n.h/2];
  if (side==='left')   return [n.x,             n.y+n.h/2];
  if (side==='bottom') return [n.x+n.w/2,      n.y+n.h];
  if (side==='top')    return [n.x+n.w/2,      n.y];
}

function makePath(edge) {
  const [fx,fy] = pt(edge.from, edge.fs);
  const [tx,ty] = pt(edge.to,   edge.ts);
  if ((edge.fs==='right' && edge.ts==='left') || (edge.fs==='left' && edge.ts==='right')) {
    const cx = (fx+tx)/2;
    return `M ${fx},${fy} C ${cx},${fy} ${cx},${ty} ${tx},${ty}`;
  }
  if (edge.fs==='bottom' && edge.ts==='top') {
    const dy = Math.abs(ty-fy)*0.5;
    return `M ${fx},${fy} C ${fx},${fy+dy} ${tx},${ty-dy} ${tx},${ty}`;
  }
  return `M ${fx},${fy} L ${tx},${ty}`;
}

// ── STATE ───────────────────────────────────────────────────────────────────
let step = 0;
const litN = new Set();
const litE = new Set();

// ── SVG CREATION ─────────────────────────────────────────────────────────────
const SVG_NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs={}, parent=null) {
  const e = document.createElementNS(SVG_NS, tag);
  Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k,v));
  if (parent) parent.appendChild(e);
  return e;
}

function initSVG() {
  const svg = document.getElementById('diagram');

  // ── DEFS ──
  const defs = el('defs', {}, svg);

  // dot grid
  const pat = el('pattern', { id:'dots', x:0, y:0, width:28, height:28, patternUnits:'userSpaceOnUse' }, defs);
  el('circle', { cx:1, cy:1, r:1, fill:'rgba(255,255,255,0.055)' }, pat);

  // glow filters
  [['g','#6ee7b7',10,0.65],['p','#a78bfa',10,0.65],['y','#fbbf24',10,0.65],['w','#e2e8f0',8,0.40]]
    .forEach(([id,color,sd,op]) => {
      const f = el('filter', { id:`gf-${id}`, x:'-70%', y:'-70%', width:'240%', height:'240%' }, defs);
      el('feDropShadow', { dx:0, dy:0, stdDeviation:sd, 'flood-color':color, 'flood-opacity':op }, f);
    });

  // arrow markers
  [['g','#6ee7b7'],['p','#a78bfa'],['y','#fbbf24'],['w','rgba(230,238,248,0.80)'],['d','rgba(255,255,255,0.18)']]
    .forEach(([id,fill]) => {
      const m = el('marker', { id:`mk-${id}`, markerWidth:10, markerHeight:7, refX:9, refY:3.5, orient:'auto' }, defs);
      el('polygon', { points:'0,0 10,3.5 0,7', fill }, m);
    });

  // clip paths for nodes
  Object.entries(N).forEach(([id, n]) => {
    const cp = el('clipPath', { id:`cp-${id}` }, defs);
    el('rect', { x:n.x, y:n.y, width:n.w, height:n.h, rx:n.r }, cp);
  });

  // ── BACKGROUND ──
  el('rect', { width:1280, height:570, fill:'url(#dots)' }, svg);

  // ── EDGES ──
  E.forEach(edge => {
    const g = el('g', { id:`eg-${edge.id}` }, svg);
    const path = el('path', {
      id: `ep-${edge.id}`,
      d: makePath(edge),
      stroke: 'rgba(255,255,255,0.10)',
      'stroke-width': 1.5,
      'stroke-dasharray': '7 5',
      'marker-end': 'url(#mk-d)',
    }, g);
    path.style.transition = 'stroke 400ms ease, stroke-width 400ms ease';

    // connection dots
    const [fx,fy] = pt(edge.from, edge.fs);
    const [tx,ty] = pt(edge.to,   edge.ts);
    [[fx,fy,'from'],[tx,ty,'to']].forEach(([cx,cy,end]) => {
      const c = el('circle', {
        id: `ec-${edge.id}-${end}`,
        cx, cy, r: 4.5,
        fill: 'rgba(255,255,255,0.08)',
        stroke: 'rgba(255,255,255,0.16)',
        'stroke-width': 1,
      }, g);
      c.style.transition = 'fill 400ms ease, stroke 400ms ease';
    });
  });

  // ── NODES ──
  Object.entries(N).forEach(([id, n]) => {
    const g = el('g', { id:`ng-${id}` }, svg);
    g.style.opacity = id==='coordinator' ? '0.32' : '0.20';
    g.style.transition = 'opacity 500ms cubic-bezier(0.16,1,0.3,1)';

    const cy = n.y + n.h/2;

    // card + icon bg (clipped to rounded rect)
    const clipG = el('g', { 'clip-path':`url(#cp-${id})` }, g);
    el('rect', { x:n.x, y:n.y, width:n.w, height:n.h, fill:'#141228' }, clipG);
    const iconBg = el('rect', {
      id: `nib-${id}`,
      x:n.x, y:n.y, width:n.iw, height:n.h,
      fill: toRgba(n.color, 0.08),
    }, clipG);
    iconBg.style.transition = 'fill 500ms ease';

    // divider line
    el('line', {
      x1: n.x+n.iw, y1: n.y+8, x2: n.x+n.iw, y2: n.y+n.h-8,
      stroke:'rgba(255,255,255,0.07)', 'stroke-width':1,
    }, g);

    // border
    const border = el('rect', {
      id: `nbr-${id}`,
      x:n.x, y:n.y, width:n.w, height:n.h, rx:n.r,
      fill:'none', stroke:n.color,
      'stroke-width': id==='coordinator' ? 2 : 1.5,
      'stroke-opacity': '0.18',
    }, g);
    border.style.transition = 'stroke-opacity 500ms ease, stroke-width 500ms ease';

    // icon (20×20 centered in icon area)
    const iconCx = n.x + n.iw/2;
    const s = 20/24;
    const iconG = el('g', {
      id: `ni-${id}`,
      transform: `translate(${iconCx - 12*s}, ${cy - 12*s}) scale(${s})`,
      stroke: toRgba(n.color, 0.30),
      fill: 'none',
      'stroke-linecap': 'round',
      'stroke-linejoin': 'round',
    }, g);
    iconG.style.transition = 'stroke 500ms ease';
    iconG.innerHTML = n.icon;

    // texts
    const tx = n.x + n.iw + 12;
    let titleY, subY, sub2Y;
    if (n.sub2) { titleY = cy-11; subY = cy+3; sub2Y = cy+17; }
    else if (n.sub) { titleY = cy-6; subY = cy+9; }
    else { titleY = cy+5; }

    const titleT = el('text', {
      id:`nt-${id}`, x:tx, y:titleY,
      fill:'rgba(255,255,255,0.32)',
      'font-size': id==='coordinator' ? 15 : 13,
      'font-weight': 700,
      'font-family': '-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif',
    }, g);
    titleT.textContent = n.title;
    titleT.style.transition = 'fill 500ms ease';

    if (n.sub) {
      const subT = el('text', {
        id:`ns-${id}`, x:tx, y:subY,
        fill:'rgba(255,255,255,0.18)',
        'font-size': id==='coordinator' ? 11 : 10.5,
        'font-family': '-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif',
      }, g);
      subT.textContent = n.sub;
      subT.style.transition = 'fill 500ms ease';
    }

    if (n.sub2) {
      const sub2T = el('text', {
        id:`ns2-${id}`, x:tx, y:sub2Y,
        fill:'rgba(110,231,183,0.22)',
        'font-size': 10,
        'font-style': 'italic',
        'font-family': '-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif',
      }, g);
      sub2T.textContent = n.sub2;
      sub2T.style.transition = 'fill 500ms ease';
    }
  });
}

// ── UPDATE ──────────────────────────────────────────────────────────────────
function updateState() {
  Object.entries(N).forEach(([id, n]) => {
    const lit = litN.has(id);
    const g = document.getElementById(`ng-${id}`);
    g.style.opacity = lit ? '1' : (id==='coordinator' ? '0.32' : '0.20');
    g.setAttribute('filter', lit ? `url(#gf-${n.gf})` : '');

    const ib = document.getElementById(`nib-${id}`);
    if (ib) ib.setAttribute('fill', toRgba(n.color, lit ? 0.20 : 0.07));

    const br = document.getElementById(`nbr-${id}`);
    if (br) br.setAttribute('stroke-opacity', lit ? '1' : (id==='coordinator' ? '0.25' : '0.16'));

    const ic = document.getElementById(`ni-${id}`);
    if (ic) ic.setAttribute('stroke', lit ? n.color : toRgba(n.color, 0.28));

    const tt = document.getElementById(`nt-${id}`);
    if (tt) tt.setAttribute('fill', lit ? '#ffffff' : 'rgba(255,255,255,0.32)');

    const st = document.getElementById(`ns-${id}`);
    if (st) st.setAttribute('fill', lit ? 'rgba(255,255,255,0.52)' : 'rgba(255,255,255,0.18)');

    const s2 = document.getElementById(`ns2-${id}`);
    if (s2) s2.setAttribute('fill', lit ? 'rgba(110,231,183,0.65)' : 'rgba(110,231,183,0.22)');
  });

  E.forEach(edge => {
    const lit = litE.has(edge.id);
    const path = document.getElementById(`ep-${edge.id}`);
    if (path) {
      path.setAttribute('stroke', lit ? edge.color : 'rgba(255,255,255,0.10)');
      path.setAttribute('stroke-width', lit ? '2.2' : '1.5');
      path.setAttribute('stroke-dasharray', lit ? 'none' : '7 5');
      path.setAttribute('marker-end', lit ? `url(#mk-${edge.mk})` : 'url(#mk-d)');
    }
    ['from','to'].forEach(end => {
      const c = document.getElementById(`ec-${edge.id}-${end}`);
      if (c) {
        c.setAttribute('fill',   lit ? toRgba(edge.color, 0.22) : 'rgba(255,255,255,0.08)');
        c.setAttribute('stroke', lit ? edge.color : 'rgba(255,255,255,0.16)');
        c.setAttribute('r',      lit ? '5' : '4.5');
      }
    });
  });

  document.getElementById('subtitle').textContent = STEPS[step].sub || '';
  document.getElementById('counter').textContent  = `${step} / ${STEPS.length-1}`;
  document.getElementById('hint').style.opacity   = step===0 ? '1' : '0';
}

function go(dir) {
  if (dir>0 && step>=STEPS.length-1) return;
  if (dir<0 && step<=0) return;
  step += dir;
  if (dir < 0) {
    litN.clear(); litE.clear();
    for (let i=1; i<=step; i++) {
      STEPS[i].nodes.forEach(id => litN.add(id));
      STEPS[i].edges.forEach(id => litE.add(id));
    }
  } else {
    STEPS[step].nodes.forEach(id => litN.add(id));
    STEPS[step].edges.forEach(id => litE.add(id));
  }
  updateState();
}

document.addEventListener('click', () => go(1));
document.addEventListener('keydown', e => {
  if (e.code==='Space'||e.code==='ArrowRight') { e.preventDefault(); go(1); }
  if (e.code==='ArrowLeft') { e.preventDefault(); go(-1); }
});

initSVG();
updateState();
</script>
</body>
</html>
