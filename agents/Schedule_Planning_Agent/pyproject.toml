[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schedule-planning-agent"
version = "0.1.0"
description = "DayPilot Schedule Planning Agent — synthesizes all agent outputs into an optimized daily schedule"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "google-generativeai>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "anyio>=4.4.0",
    "coverage>=7.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["app"]
