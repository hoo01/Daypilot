steps:
  # Run unit tests
  - name: "python:3.12-slim"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install --quiet ".[dev]" && \
        pytest tests/unit/ -v --tb=short
    id: test

  # Build Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - "-t"
      - "$$LOCATION-docker.pkg.dev/$PROJECT_ID/daypilot/goal-tracking-agent:$COMMIT_SHA"
      - "-t"
      - "$$LOCATION-docker.pkg.dev/$PROJECT_ID/daypilot/goal-tracking-agent:latest"
      - "."
    env:
      - "LOCATION=us-central1"
    id: build
    waitFor: ["test"]

  # Push to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "--all-tags"
      - "$$LOCATION-docker.pkg.dev/$PROJECT_ID/daypilot/goal-tracking-agent"
    env:
      - "LOCATION=us-central1"
    id: push
    waitFor: ["build"]

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - run
      - deploy
      - goal-tracking-agent
      - "--image=$$LOCATION-docker.pkg.dev/$PROJECT_ID/daypilot/goal-tracking-agent:$COMMIT_SHA"
      - "--region=us-central1"
      - "--platform=managed"
      - "--allow-unauthenticated=false"
      - "--set-secrets=MONGO_URI=MONGO_URI:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest"
    env:
      - "LOCATION=us-central1"
    waitFor: ["push"]

images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/daypilot/goal-tracking-agent:$COMMIT_SHA"
  - "us-central1-docker.pkg.dev/$PROJECT_ID/daypilot/goal-tracking-agent:latest"

options:
  logging: CLOUD_LOGGING_ONLY
