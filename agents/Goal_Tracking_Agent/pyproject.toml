[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goal-tracking-agent"
version = "0.2.0"
description = "DayPilot Goal Tracking Agent — manages the full lifecycle of user goals"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "motor>=3.4.0",
    "pymongo>=4.8.0",
    "httpx>=0.27.0",
    "google-adk>=1.0.0",
    "google-auth>=2.30.0",
    "google-api-python-client>=2.130.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "mongomock-motor>=0.0.21",
    "httpx>=0.27.0",
    "anyio>=4.4.0",
    "coverage>=7.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["app"]
